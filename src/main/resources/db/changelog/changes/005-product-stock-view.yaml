databaseChangeLog:
  - changeSet:
      id: 005-product-stock-view-quantity
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: product_view
                columnName: quantity
      changes:
        - addColumn:
            tableName: product_view
            columns:
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-product-stock-view-reserved-quantity
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: product_view
                columnName: reserved_quantity
      changes:
        - addColumn:
            tableName: product_view
            columns:
              - column:
                  name: reserved_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
